<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Cutout — #30DayMapChallenge 2026 Day 3 Polygons</title>
    <meta
      name="description"
      content="Cut one city's buildings with another municipality's boundary. PLATEAU (Flateau V2) and National Land Numerical Information N03."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <header class="title">
          <div class="title-row">
            <h1 data-i18n="app.title">City Cutout</h1>
            <button id="btn-lang" type="button" class="lang" data-i18n="lang.switch">日本語</button>
          </div>
          <p class="sub" data-i18n="app.sub">#30DayMapChallenge 2026 · Day 3 — Polygons</p>
          <p class="lead" data-i18n="app.lead"></p>
        </header>

        <section id="sec-material">
          <h2><span class="step">01</span><span data-i18n="step1.title"></span><small data-i18n="step1.sub"></small></h2>
          <input id="material-filter" type="search" data-i18n-placeholder="material.filter" />
          <select id="material-select" size="6" data-i18n-aria="step1.title"></select>
          <div class="row">
            <label for="source-select" data-i18n="source.label"></label>
            <select id="source-select">
              <option value="r2" disabled data-i18n="source.r2"></option>
              <option value="origin" selected data-i18n="source.origin"></option>
            </select>
          </div>
          <dl id="material-info" class="info"></dl>
        </section>

        <section id="sec-template">
          <h2><span class="step">02</span><span data-i18n="step2.title"></span><small data-i18n="step2.sub"></small></h2>
          <div class="row">
            <label for="pref-select" data-i18n="pref.label"></label>
            <select id="pref-select"></select>
          </div>
          <div class="row">
            <label for="unit-filter" data-i18n="unit.label"></label>
            <input id="unit-filter" type="search" data-i18n-placeholder="unit.filter" />
          </div>
          <select id="unit-select" size="6" data-i18n-aria="unit.label"></select>
          <div id="template-info" class="info"></div>
          <svg id="template-thumb" viewBox="0 0 100 100" data-i18n-aria="thumb.aria"></svg>
        </section>

        <section id="sec-place">
          <h2><span class="step">03</span><span data-i18n="step3.title"></span><small data-i18n="step3.sub"></small></h2>
          <p class="hint" data-i18n="place.hint"></p>
          <div class="row">
            <label for="width-num" data-i18n="place.width"></label>
            <input id="width-range" type="range" min="200" max="20000" step="50" />
            <input id="width-num" type="number" min="50" max="200000" step="10" />
          </div>
          <div class="row">
            <label for="rot-num" data-i18n="place.rot"></label>
            <input id="rot-range" type="range" min="-180" max="180" step="1" />
            <input id="rot-num" type="number" min="-180" max="180" step="0.5" />
          </div>
          <div class="row buttons">
            <button id="btn-center" type="button" data-i18n="place.center"></button>
            <button id="btn-fit" type="button" data-i18n="place.fit"></button>
          </div>
          <div id="place-info" class="info small"></div>
        </section>

        <section id="sec-cut">
          <h2><span class="step">04</span><span data-i18n="step4.title"></span><small data-i18n="step4.sub"></small></h2>
          <div class="cut-row">
            <button id="btn-cut" type="button"><svg id="cut-shape" viewBox="0 0 100 100" aria-hidden="true"></svg><span data-i18n="cut.btn"></span></button>
          </div>
          <div class="row buttons"><button id="btn-force" type="button" hidden data-i18n="cut.force"></button></div>
          <label class="check"><input id="auto-cut" type="checkbox" checked /> <span data-i18n="cut.auto"></span></label>
          <div class="row">
            <label for="read-mode" data-i18n="cut.read"></label>
            <select id="read-mode">
              <option value="full" selected data-i18n="read.full"></option>
              <option value="range" data-i18n="read.range"></option>
            </select>
          </div>
          <p class="hint" data-i18n="cut.readHint"></p>
          <div id="job-status" class="status" aria-live="polite"></div>
          <div id="job-stats" class="info small"></div>
        </section>

        <section id="sec-view">
          <h2><span class="step">05</span><span data-i18n="step5.title"></span><small data-i18n="step5.sub"></small></h2>
          <div class="row">
            <label for="ex-range" data-i18n="view.ex"></label>
            <input id="ex-range" type="range" min="0.5" max="5" step="0.1" value="1" />
            <output id="ex-num"></output>
          </div>
          <div class="row">
            <label for="lift-range" data-i18n="view.lift"></label>
            <input id="lift-range" type="range" min="0" max="500" step="10" value="0" />
            <output id="lift-num"></output>
          </div>
          <div class="row">
            <label for="color-mode" data-i18n="view.color"></label>
            <select id="color-mode">
              <option value="height" data-i18n="color.height"></option>
              <option value="cut" data-i18n="color.cut"></option>
              <option value="src" data-i18n="color.src"></option>
            </select>
          </div>
          <label class="check"><input id="show-cand" type="checkbox" checked /> <span data-i18n="view.cand"></span></label>
          <label class="check"><input id="show-plinth" type="checkbox" checked /> <span data-i18n="view.plinth"></span></label>
          <label class="check"><input id="show-preview" type="checkbox" checked /> <span data-i18n="view.preview"></span></label>
          <div class="row buttons">
            <button id="btn-export" type="button" disabled data-i18n="view.export"></button>
          </div>
          <div id="legend" class="legend small"></div>
        </section>

        <footer id="credits" class="small">
          <h2 data-i18n="credits.title"></h2>
          <ul data-i18n-html="credits.html"></ul>
          <p id="engine-info"></p>
        </footer>
      </aside>

      <main id="map-wrap">
        <div id="map"></div>
        <div id="hud">
          <div><span class="k" data-i18n="hud.dough"></span><span id="hud-material"></span></div>
          <div><span class="k" data-i18n="hud.cutter"></span><span id="hud-template"></span></div>
          <div><span class="k" data-i18n="hud.result"></span><span id="hud-result"></span></div>
          <div class="small" id="hud-map"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
